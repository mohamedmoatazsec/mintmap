name: MintMap
description: Fail a pull request when a reviewed Django login/credential path, its code or checks, or MintMap's own coverage changes.
branding:
  icon: lock
  color: gray-dark

inputs:
  project-dir:
    description: Directory of the Django project (where manage.py or the settings package lives).
    default: "."
  lock:
    description: Path of the reviewed lock file. Default is <project-dir>/mintmap.lock.
    default: ""
  library-path:
    description: >
      Optional directories with library source, separated by ':'. Read only; nothing is imported. Do not fill
      them by installing the pull request's dependencies in this job: installing packages can run code from the
      pull request before MintMap runs (see docs/ENFORCEMENT.md).
    default: ""
  fail-on:
    description: >
      Exit-code bits that fail the job, as a decimal number from 0 to 255 (bitmask). Default 255 = any finding.
      1 new_path, 2 removed_path, 4 fingerprint_changed, 8 evidence_downgraded, 16 purpose_changed,
      32 coverage_regression, 64 unreviewed. Bit 128 (MintMap could not run) always fails the job.
    default: "255"
  python-version:
    description: >
      Python used to run MintMap (3.11 or newer; 3.11 to 3.14 are tested). It must be able to parse the
      project's code (at least the Python version whose syntax the project uses); files it cannot parse are
      reported as parse failures. Lock fingerprints are the same on 3.11, 3.12 and 3.13; with any other version,
      write the lock with the same Python minor version that CI uses.
    default: "3.12"

outputs:
  exit-code:
    description: The raw `mintmap diff` exit code (bitmask).
    value: ${{ steps.diff.outputs.exit-code }}
  findings:
    description: Path of the JSON findings file (unique per run of this action).
    value: ${{ steps.diff.outputs.findings }}

runs:
  using: composite
  steps:
    # update-environment: false leaves the job's PATH and `python` unchanged; MintMap uses the interpreter path.
    - id: python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: false

    # MintMap runs from this action's own checkout with `python -I`: the working directory (the pull request's
    # checkout) is not on sys.path, so files in the pull request cannot replace MintMap or the modules it imports.
    # Nothing is built or downloaded.
    - name: mintmap diff
      id: diff
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MM_PYTHON: ${{ steps.python.outputs.python-path }}
        MM_PROJECT: ${{ inputs.project-dir }}
        MM_LOCK: ${{ inputs.lock }}
        MM_LIBS: ${{ inputs.library-path }}
        MM_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set +e
        if ! [[ "$MM_FAIL_ON" =~ ^[0-9]{1,3}$ ]] || (( 10#$MM_FAIL_ON > 255 )); then
          echo "::error::fail-on must be a decimal number from 0 to 255 (bitmask), got: $MM_FAIL_ON"
          exit 1
        fi
        fail_on=$(( 10#$MM_FAIL_ON | 128 ))
        run=("$MM_PYTHON" -I "$ACTION_PATH/scripts/run_mintmap.py")
        findings="$(mktemp "$RUNNER_TEMP/mintmap-findings.XXXXXX")" || exit 1
        args=(diff "$MM_PROJECT" --json "$findings")
        if [ -n "$MM_LOCK" ]; then args+=(--lock "$MM_LOCK"); fi
        if [ -n "$MM_LIBS" ]; then args+=(--library-path "$MM_LIBS"); fi
        # Text from the pull request appears in MintMap's output; stop the runner from reading workflow commands
        # (`::error::`, `::add-mask::`, ...) in it. The token is random, so the output cannot end the pause.
        stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        echo "::stop-commands::$stop"
        "${run[@]}" "${args[@]}"
        code=$?
        echo "::$stop::"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        "${run[@]}" --summary "$findings" "$code" >> "$GITHUB_STEP_SUMMARY"
        if (( code & 128 )); then
          echo "::error::MintMap could not run (exit $code). See the step log above."
          exit 1
        fi
        if (( code & fail_on )); then
          echo "::error::MintMap found changes to login/credential paths (exit $code). See the job summary."
          exit 1
        fi
