# Keeps the pinned commit SHAs of GitHub Actions (workflows and action.yml) up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # The hash-pinned build tools of the release workflow (.github/release-requirements.txt).
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
