name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -I -m unittest discover -s tests -t tests
      - name: Package installs and runs
        run: |
          python -m pip install --quiet .
          mintmap scan tests/fixtures/basic_project

  # The demo shown in the README: scripts/demo.sh checks its own exit codes, the second step asserts the failing
  # exit code directly, and the last one fails if docs/assets/demo.svg no longer matches the real output.
  demo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the demo
        run: bash scripts/demo.sh
      - name: The bad pull request must make mintmap diff exit 12
        run: |
          cp -R examples/demo "$RUNNER_TEMP/pr"
          cd "$RUNNER_TEMP/pr"
          git apply bad-pr.patch
          code=0
          python -I "$GITHUB_WORKSPACE/scripts/run_mintmap.py" diff . || code=$?
          echo "mintmap diff exited $code"
          test "$code" -eq 12
      - name: The README image matches the demo output
        if: matrix.python-version == '3.13'
        run: python scripts/render_demo.py --check
