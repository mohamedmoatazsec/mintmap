name: Bug report
description: MintMap crashed, exited with 128, or a command does not do what the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a login or credential path that MintMap missed, or a false alarm, please use the "Missed path or false alarm" template instead.
        For a vulnerability in MintMap itself, see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: MintMap version
      description: Output of `mintmap --version`. 0.6.0a1 has no `--version`; for it, give the output of `pip show mintmap` or the commit you run.
      placeholder: mintmap 0.6.0a2
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
      placeholder: Python 3.12.7 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command and what it printed, including the traceback if there is one.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest code that shows it
      description: A few lines of Django code written for this report. Please do not paste code from a private or GPL-licensed project.
      render: python
