<text x="18" y="65" fill="#8b949e" textLength="782.0" lengthAdjust="spacingAndGlyphs">#&#160;1.&#160;What&#160;MintMap&#160;finds&#160;in&#160;the&#160;demo:&#160;3&#160;logins,&#160;1&#160;API&#160;token,&#160;the&#160;two-step&#160;sign-in&#160;marker,&#160;1&#160;candidate</text>
