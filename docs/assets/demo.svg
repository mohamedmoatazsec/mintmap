<text x="18" y="350" fill="#8b949e" textLength="547.4" lengthAdjust="spacingAndGlyphs">#&#160;3.&#160;A&#160;pull&#160;request&#160;makes&#160;the&#160;TOTP&#160;step&#160;ignore&#160;the&#160;result&#160;of&#160;its&#160;check</text>
<text x="18" y="369" fill="#79c0ff" font-weight="bold" textLength="508.3" lengthAdjust="spacingAndGlyphs">$&#160;git&#160;apply&#160;bad-pr.patch&#160;&#160;&#160;#&#160;in&#160;a&#160;temporary&#160;copy&#160;of&#160;examples/demo</text>
<text x="18" y="388" fill="#ff7b72" textLength="250.2" lengthAdjust="spacingAndGlyphs">-&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;if&#160;not&#160;form.is_valid():</text>
<text x="18" y="407" fill="#ff7b72" textLength="719.4" lengthAdjust="spacingAndGlyphs">-&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;return&#160;render(request,&#160;"members/sign_in_code.html",&#160;{"form":&#160;form},&#160;status=400)</text>
<text x="18" y="426" fill="#7ee787" textLength="523.9" lengthAdjust="spacingAndGlyphs">+&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;form.is_valid()&#160;&#160;#&#160;field&#160;errors&#160;are&#160;shown&#160;on&#160;the&#160;next&#160;page</text>
<text x="18" y="464" fill="#8b949e" textLength="351.9" lengthAdjust="spacingAndGlyphs">#&#160;4.&#160;CI&#160;runs&#160;mintmap&#160;diff&#160;on&#160;the&#160;pull&#160;request</text>
<text x="18" y="483" fill="#79c0ff" font-weight="bold" textLength="125.1" lengthAdjust="spacingAndGlyphs">$&#160;mintmap&#160;diff&#160;.</text>
