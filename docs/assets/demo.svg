<text x="18" y="103" fill="#c9d1d9" textLength="703.8" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;&#160;&#160;[1686eb3b06d009ce]&#160;medium&#160;django.contrib.auth.login&#160;at&#160;members.views.finish_reset:68</text>
