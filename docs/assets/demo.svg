<text x="18" y="65" fill="#8b949e" textLength="758.5" lengthAdjust="spacingAndGlyphs"># 1. Every way to get signed in to the demo project (the full report: mintmap scan examples/demo)</text>
<text x="18" y="84" fill="#79c0ff" font-weight="bold" textLength="610.0" lengthAdjust="spacingAndGlyphs">$ mintmap scan examples/demo | grep -E '^ +\[[0-9a-f]{16}\] (high|medium|low)'</text>
