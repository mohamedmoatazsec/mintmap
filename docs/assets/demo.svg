<text x="18" y="654" fill="#7ee787" font-weight="bold" textLength="860.2" lengthAdjust="spacingAndGlyphs">demo ok: the reviewed code exits 0, the bad pull request exits 12 (fingerprint_changed + evidence_downgraded),</text>
