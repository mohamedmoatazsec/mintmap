<text x="18" y="559" fill="#e3b341" textLength="226.8" lengthAdjust="spacingAndGlyphs">&#160;&#160;&#160;&#160;check_result_not_enforced</text>
<text x="18" y="578" fill="#ff7b72" font-weight="bold" textLength="391.0" lengthAdjust="spacingAndGlyphs">exit&#160;12&#160;(fingerprint_changed,&#160;evidence_downgraded)</text>
<text x="18" y="597" fill="#79c0ff" font-weight="bold" textLength="70.4" lengthAdjust="spacingAndGlyphs">$&#160;echo&#160;$?</text>
